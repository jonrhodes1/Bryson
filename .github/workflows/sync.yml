name: Sync

on:
  schedule:
    - cron: "15 4 * * *"      # 04:15 UTC daily (05:15 UK summer time)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["state.enc", "site/**", "sync/**", ".github/workflows/sync.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: Install
        run: pip install -r sync/requirements.txt

      # Parsed workout files are cached between runs (never committed), so each night only fetches new sessions.
      - name: Restore workout cache
        uses: actions/cache/restore@v4
        with:
          path: sync/cache
          key: tp-cache-${{ github.run_id }}
          restore-keys: tp-cache-

      - name: Fetch, analyse, encrypt
        env:
          TP_AUTH_COOKIE: ${{ secrets.TP_AUTH_COOKIE }}
          DASH_PASSPHRASE: ${{ secrets.DASH_PASSPHRASE }}
          TP_ATHLETE: ${{ vars.TP_ATHLETE }}
          TP_START: ${{ vars.TP_START }}
        run: python sync/run.py --out _site

      - name: Save workout cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sync/cache
          key: tp-cache-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
